<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Pesquisas - Marcelo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            align-items: flex-start;
            padding-top: 35px;
        }

        .research-container {
            width: 100%;
            max-width: 960px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-bar {
            margin-bottom: 25px;
        }

        .neon-input {
            width: 100%;
            background: #06060a;
            border: 1px solid #1eff00;
            border-radius: 12px;
            padding: 13px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 0, 234, 0.25);
            transition: 0.3s;
        }

        .neon-input:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.55);
        }

        /* Grade de Ícones / Cards do Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .icon-card {
            background: #090912;
            border: 2px solid #00f3ff;
            border-radius: 22px;
            padding: 24px 18px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25), inset 0 0 12px rgba(0, 243, 255, 0.08);
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-width: 0;
        }

        .icon-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #09ff00;
            box-shadow: 0 0 25px rgba(5, 144, 37, 0.55), inset 0 0 15px rgba(255, 0, 234, 0.15);
        }

        /* Estilo especial para cards com miniatura do YouTube */
        .icon-card.youtube-card {
            padding: 0 0 18px 0;
            overflow: hidden;
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .icon-card.youtube-card:hover {
            border-color: #39ff14;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.55);
        }

        .yt-thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 0, 85, 0.4);
        }

        .yt-thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .icon-card.youtube-card:hover .yt-thumb-img {
            transform: scale(1.06);
        }

        .yt-play-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 30px;
            background: rgba(255, 0, 0, 0.9);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.95rem;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .yt-card-body {
            padding: 0 14px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        .card-icon {
            font-size: 2.6rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.7));
        }

        .card-category {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #00f508;
            text-shadow: 0 0 6px #0db401;
            margin-bottom: 5px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-title {
            font-size: 1.05rem;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
            margin-bottom: 8px;
            word-break: break-word;
        }

        .card-note {
            font-size: 0.82rem;
            color: #b8c4e0;
            line-height: 1.4;
            margin-bottom: 12px;
            white-space: pre-line;
            background: rgba(255, 255, 255, 0.03);
            border-left: 2px solid #00f3ff;
            padding: 7px 9px;
            border-radius: 6px;
            width: 100%;
            text-align: left;
            word-break: break-word;
        }

        .card-open-label {
            font-size: 0.78rem;
            color: #39ff14;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }

        .yt-label {
            color: #ff2a70;
            text-shadow: 0 0 8px rgba(255, 42, 112, 0.6);
        }

        /* Página Aberta da Ideia / Pesquisa */
        .detail-page {
            display: none;
            background: #090910;
            border: 2px solid #39ff14;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 0 28px rgba(57, 255, 20, 0.3);
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        .detail-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(57, 255, 20, 0.3);
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .detail-header-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 12px rgba(57, 255, 20, 0.7));
        }

        .detail-category {
            color: #04ff64;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px #00ff33;
        }

        .detail-title {
            color: #39ff14;
            font-size: 1.8rem;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.6);
        }

        .detail-content {
            background: #050508;
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 16px;
            padding: 22px;
            color: #e8eeff;
            font-size: 1rem;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        .detail-link {
            display: inline-block;
            margin-top: 18px;
            color: #00f3ff;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 8px #00f3ff;
        }

        .hidden {
            display: none !important;
        }

        /* Celular: mantém sempre 3 cards por linha (3x3 conforme adiciona itens) */
        @media (max-width: 768px) {
            body {
                padding-top: 18px;
            }

            .menu-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
            }

            .icon-card {
                border-radius: 12px;
                padding: 10px 6px;
            }

            .icon-card.youtube-card {
                padding: 0 0 10px 0;
                border-radius: 12px;
            }

            .yt-thumb-wrapper {
                margin-bottom: 6px;
            }

            .yt-play-badge {
                width: 24px;
                height: 18px;
                font-size: 0.55rem;
                border-radius: 4px;
            }

            .yt-card-body {
                padding: 0 5px;
            }

            .card-icon {
                font-size: 1.4rem;
                margin-bottom: 6px;
            }

            .card-category {
                font-size: 0.45rem;
                letter-spacing: 0.5px;
                margin-bottom: 3px;
            }

            .card-title {
                font-size: 0.65rem;
                line-height: 1.2;
                margin-bottom: 5px;
            }

            .card-note {
                font-size: 0.55rem;
                line-height: 1.25;
                padding: 4px 5px;
                margin-bottom: 6px;
                border-left-width: 1.5px;
            }

            .card-open-label {
                font-size: 0.52rem;
                line-height: 1.15;
            }
        }
    </style>
</head>
<body>

    <main class="container research-container">

        <!-- TELA 1: MENU DE ÍCONES E VÍDEOS -->
        <div id="menuView">
            <div class="top-bar">
                <header class="header" style="text-align: left;">
                    <h3>Marcelo Bittencourt</h3>
                    <h1 style="margin-bottom: 0;">ARQUIVO PESSOAL</h1>
                </header>
                <a href="index.html" class="neon-btn">🔒 Sair</a>
            </div>

            <div class="search-bar">
                <input type="text" id="filtro" class="neon-input" placeholder="🔍 Filtrar vídeos ou ideias pelo nome...">
            </div>

            <!-- Os cards e miniaturas são criados automaticamente a partir da lista lá embaixo -->
            <section class="menu-grid" id="menuGrid"></section>
        </div>

        <!-- TELA 2: PÁGINA INTERNA DA IDEIA SELECIONADA (Para notas sem vídeo) -->
        <section id="detailView" class="detail-page">
            <div class="detail-top">
                <button type="button" id="backToMenuBtn" class="neon-btn">← Voltar ao Menu</button>
                <span id="detailDate" style="color: #7d87a2; font-size: 0.85rem;"></span>
            </div>

            <div class="detail-header-info">
                <div class="detail-icon" id="detailIcon">💡</div>
                <div>
                    <div class="detail-category" id="detailCategory">CATEGORIA</div>
                    <h2 class="detail-title" id="detailTitle">Título</h2>
                </div>
            </div>

            <div class="detail-content" id="detailContent"></div>

            <a href="#" target="_blank" id="detailLink" class="detail-link hidden">🔗 Abrir link relacionado →</a>
        </section>

    </main>

    <script>
        // =========================================================================
        // ✍️ ADICIONE SEUS VÍDEOS DO YOUTUBE OU IDEIAS AQUI DENTRO!
        // O campo "texto" aparece logo abaixo do título antes do botão do YouTube.
        // =========================================================================
        const MINHAS_PESQUISAS = [
            {
                titulo: "XIAOMI 18 PRO MAX",
                link: "https://www.youtube.com/watch?v=A29056hds10",
                texto: `J'ai voulu vivre avec le Xiaomi 18 Pro Max plutôt que simplement le tester.`
            },
            {
                titulo: "XIAOMI 18 PRO MAX",
                link: "https://www.youtube.com/watch?v=_KvhRIASXHw",
                texto: `J'ai voulu vivre avec le Xiaomi 18 Pro Max plutôt que simplement le tester.`
            },
            {
                titulo: "XIAOMI 18 PRO MAX",
                link: "https://www.youtube.com/watch?v=A29056hds10",
                texto: `J'ai voulu vivre avec le Xiaomi 18 Pro Max plutôt que simplement le tester.`
            }
        ];
        // =========================================================================

        const menuView = document.getElementById('menuView');
        const detailView = document.getElementById('detailView');
        const menuGrid = document.getElementById('menuGrid');
        const filtro = document.getElementById('filtro');

        function extrairIdYouTube(url) {
            if (!url) return null;
            const regex = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        function renderizarMenu(termo = '') {
            menuGrid.innerHTML = '';
            const termoLower = termo.toLowerCase();

            const filtradas = MINHAS_PESQUISAS
                .map((item, index) => ({ ...item, indexOriginal: index }))
                .filter(p =>
                    (p.titulo && p.titulo.toLowerCase().includes(termoLower)) ||
                    (p.categoria && p.categoria.toLowerCase().includes(termoLower)) ||
                    (p.texto && p.texto.toLowerCase().includes(termoLower))
                );

            if (filtradas.length === 0) {
                menuGrid.innerHTML = '<p style="color: #8892b0; grid-column: 1 / -1;">Nenhum vídeo ou ideia encontrada.</p>';
                return;
            }

            filtradas.forEach(item => {
                const videoId = extrairIdYouTube(item.link);
                const card = document.createElement('div');
                const mensagemHtml = item.texto && item.texto.trim()
                    ? `<p class="card-note">${item.texto.trim()}</p>`
                    : '';

                if (videoId) {
                    const thumbUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                    card.className = 'icon-card youtube-card';
                    card.onclick = () => window.open(item.link, '_blank', 'noopener,noreferrer');
                    card.innerHTML = `
                        <div class="yt-thumb-wrapper">
                            <img src="${thumbUrl}" alt="${item.titulo || 'Vídeo do YouTube'}" class="yt-thumb-img" loading="lazy">
                            <div class="yt-play-badge">▶</div>
                        </div>
                        <div class="yt-card-body">
                            <div class="card-category">${item.categoria || 'YOUTUBE'}</div>
                            <h3 class="card-title">${item.titulo || 'Vídeo sem título'}</h3>
                            ${mensagemHtml}
                            <span class="card-open-label yt-label">▶ Assistir no YouTube →</span>
                        </div>
                    `;
                } else {
                    card.className = 'icon-card';
                    card.onclick = () => abrirIdeia(item.indexOriginal);
                    card.innerHTML = `
                        <div class="card-icon">${item.icone || '💡'}</div>
                        <div class="card-category">${item.categoria || 'NOTA'}</div>
                        <h3 class="card-title">${item.titulo || 'Sem título'}</h3>
                        ${mensagemHtml}
                        <span class="card-open-label">Abrir página →</span>
                    `;
                }

                menuGrid.appendChild(card);
            });
        }

        function abrirIdeia(index) {
            const item = MINHAS_PESQUISAS[index];
            if (!item) return;

            document.getElementById('detailIcon').textContent = item.icone || '💡';
            document.getElementById('detailCategory').textContent = item.categoria || 'NOTA';
            document.getElementById('detailTitle').textContent = item.titulo || 'Sem título';
            document.getElementById('detailDate').textContent = item.data ? `Data: ${item.data}` : '';
            document.getElementById('detailContent').textContent = item.texto || '';

            const linkEl = document.getElementById('detailLink');
            if (item.link) {
                linkEl.href = item.link;
                linkEl.classList.remove('hidden');
            } else {
                linkEl.classList.add('hidden');
            }

            menuView.classList.add('hidden');
            detailView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('backToMenuBtn').addEventListener('click', () => {
            detailView.style.display = 'none';
            menuView.classList.remove('hidden');
        });

        filtro.addEventListener('input', (e) => {
            renderizarMenu(e.target.value);
        });

        renderizarMenu();
    </script>

</body>
</html>
