<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Pesquisas - Neon Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos extras específicos para a página de pesquisas */
        body {
            align-items: flex-start;
            padding-top: 40px;
        }

        .research-container {
            width: 100%;
            max-width: 820px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .research-card {
            background: #0b0b12;
            border: 2px solid #00f3ff;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
            text-align: left;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #00f3ff;
            margin-bottom: 6px;
            text-shadow: 0 0 6px rgba(0, 243, 255, 0.5);
        }

        .neon-input, .neon-textarea {
            width: 100%;
            background: #06060a;
            border: 1px solid #ff00ea;
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 0, 234, 0.2);
            transition: 0.3s;
        }

        .neon-input:focus, .neon-textarea:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 14px rgba(0, 243, 255, 0.5);
        }

        .neon-textarea {
            min-height: 90px;
            resize: vertical;
        }

        .search-filter {
            margin-bottom: 20px;
        }

        .research-list {
            display: grid;
            gap: 16px;
        }

        .item-card {
            background: #090910;
            border: 1px solid #39ff14;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.18);
            position: relative;
        }

        .item-card h3 {
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.5);
            margin-bottom: 8px;
            padding-right: 35px;
        }

        .item-card p {
            color: #cfd6e6;
            font-size: 0.92rem;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        .item-link {
            color: #00f3ff;
            font-size: 0.85rem;
            text-decoration: none;
            word-break: break-all;
            text-shadow: 0 0 6px #00f3ff;
        }

        .item-date {
            display: block;
            font-size: 0.75rem;
            color: #6c758d;
            margin-top: 10px;
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: 1px solid #ff2a55;
            color: #ff2a55;
            border-radius: 8px;
            padding: 4px 9px;
            cursor: pointer;
            font-size: 0.8rem;
            box-shadow: 0 0 8px rgba(255, 42, 85, 0.3);
        }

        .delete-btn:hover {
            background: #ff2a55;
            color: #fff;
        }
    </style>
</head>
<body>

    <main class="container research-container">

        <div class="top-bar">
            <header class="header" style="text-align: left;">
                <h3>ARQUIVO PESSOAL</h3>
                <h1 style="margin-bottom: 0;">MINHAS PESQUISAS</h1>
            </header>
            <a href="index.html" class="neon-btn">🔒 Bloquear / Sair</a>
        </div>

        <!-- Formulário para adicionar nova pesquisa -->
        <section class="research-card">
            <form id="researchForm">
                <div class="form-group">
                    <label for="titulo">Título ou Tema da Pesquisa</label>
                    <input type="text" id="titulo" class="neon-input" placeholder="Ex: Consumo elétrico, ideias de jogos, código HTML..." required>
                </div>

                <div class="form-group">
                    <label for="link">Link / Fonte (opcional)</label>
                    <input type="url" id="link" class="neon-input" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label for="conteudo">Anotações / Resultados da Pesquisa</label>
                    <textarea id="conteudo" class="neon-textarea" placeholder="Escreva aqui os detalhes da sua pesquisa..." required></textarea>
                </div>

                <button type="submit" class="neon-btn">+ Salvar Pesquisa</button>
            </form>
        </section>

        <!-- Barra de busca -->
        <div class="search-filter">
            <input type="text" id="filtro" class="neon-input" placeholder="🔍 Filtrar pesquisas salvas...">
        </div>

        <!-- Lista de pesquisas -->
        <section class="research-list" id="listaPesquisas"></section>

    </main>

    <script>
        const form = document.getElementById('researchForm');
        const lista = document.getElementById('listaPesquisas');
        const filtro = document.getElementById('filtro');

        let pesquisas = JSON.parse(localStorage.getItem('minhas_pesquisas_neon')) || [];

        function salvarNoNavegador() {
            localStorage.setItem('minhas_pesquisas_neon', JSON.stringify(pesquisas));
        }

        function renderizarPesquisas(termo = '') {
            lista.innerHTML = '';
            const filtradas = pesquisas.filter(p =>
                p.titulo.toLowerCase().includes(termo.toLowerCase()) ||
                p.conteudo.toLowerCase().includes(termo.toLowerCase())
            );

            if (filtradas.length === 0) {
                lista.innerHTML = '<p style="color: #8892b0; text-align: center;">Nenhuma pesquisa encontrada.</p>';
                return;
            }

            filtradas.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="removerPesquisa(${item.id})">✕</button>
                    <h3>${item.titulo}</h3>
                    <p>${item.conteudo}</p>
                    ${item.link ? `<a href="${item.link}" target="_blank" class="item-link">🔗 ${item.link}</a>` : ''}
                    <span class="item-date">Salvo em: ${item.data}</span>
                `;
                lista.appendChild(card);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const novaPesquisa = {
                id: Date.now(),
                titulo: document.getElementById('titulo').value.trim(),
                link: document.getElementById('link').value.trim(),
                conteudo: document.getElementById('conteudo').value.trim(),
                data: new Date().toLocaleDateString('pt-BR') + ' às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
            };

            pesquisas.unshift(novaPesquisa);
            salvarNoNavegador();
            renderizarPesquisas(filtro.value);
            form.reset();
        });

        window.removerPesquisa = function(id) {
            pesquisas = pesquisas.filter(p => p.id !== id);
            salvarNoNavegador();
            renderizarPesquisas(filtro.value);
        };

        filtro.addEventListener('input', (e) => {
            renderizarPesquisas(e.target.value);
        });

        renderizarPesquisas();
    </script>

</body>
</html>
