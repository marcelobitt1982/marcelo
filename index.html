<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Web Marcelo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header class="header">
            <h3 class="neon-text-cyan">ÁREA RESTRITA</h3>
            <h1 class="neon-text-pink">ACESSO</h1>
        </header>

        <section class="phone-card" id="phoneCard">

            <div class="speaker"></div>

            <div class="content">

                <div class="verification">
                    <h2>Digite a senha</h2>
                    <p>
                        Insira o código de 4 dígitos para liberar o acesso.
                    </p>
                </div>

                <div class="otp-container">
                    <input type="password" inputmode="numeric" maxlength="1" class="otp-input" autofocus>
                    <input type="password" inputmode="numeric" maxlength="1" class="otp-input">
                    <input type="password" inputmode="numeric" maxlength="1" class="otp-input">
                    <input type="password" inputmode="numeric" maxlength="1" class="otp-input">
                </div>

                <p id="errorMsg" class="error-msg">Senha incorreta! Tente novamente.</p>

                <div class="resend">
                    Esqueceu ou quer limpar?
                    <a href="#" id="clearBtn">Limpar campos</a>
                </div>

                <div class="success" id="successBox">
                    <div class="check">✓</div>
                    <h2>Acesso Liberado!</h2>
                    <p>Senha 0303 confirmada com sucesso.</p>
                    <a href="pesquisas.html" class="neon-btn">Entrar nas Pesquisas →</a>
                </div>

            </div>

        </section>

        <footer>
            <p>SISTEMA NEON <span class="neon-text-cyan">V5</span></p>
            <p>Proteção de acesso • Web Marcelo</p>
        </footer>

    </main>

    <script>
        const inputs = document.querySelectorAll('.otp-input');
        const successBox = document.getElementById('successBox');
        const errorMsg = document.getElementById('errorMsg');
        const phoneCard = document.getElementById('phoneCard');
        const clearBtn = document.getElementById('clearBtn');
        const SENHA_CORRETA = "0303";

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Permite apenas números
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                errorMsg.style.display = 'none';

                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                verificarSenha();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        function verificarSenha() {
            const codigoDigitado = Array.from(inputs).map(i => i.value).join('');

            if (codigoDigitado.length === 4) {
                if (codigoDigitado === SENHA_CORRETA) {
                    phoneCard.classList.add('unlocked');
                    successBox.classList.add('active');
                    inputs.forEach(i => i.disabled = true);
                } else {
                    errorMsg.style.display = 'block';
                    phoneCard.classList.add('shake');
                    setTimeout(() => {
                        phoneCard.classList.remove('shake');
                        limparCampos();
                    }, 600);
                }
            }
        }

        function limparCampos() {
            inputs.forEach(i => {
                i.value = '';
                i.disabled = false;
            });
            successBox.classList.remove('active');
            phoneCard.classList.remove('unlocked');
            inputs[0].focus();
        }

        clearBtn.addEventListener('click', (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            limparCampos();
        });
    </script>

</body>
</html>
