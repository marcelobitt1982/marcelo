<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Pesquisas - Marcelo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        
        body {
            align-items: flex-start;
            padding-top: 35px;
        }

        .research-container {
            width: 100%;
            max-width: 900px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-bar {
            margin-bottom: 25px;
        }

        .neon-input {
            width: 100%;
            background: #06060a;
            border: 1px solid #1eff00;
            border-radius: 12px;
            padding: 13px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 0, 234, 0.25);
            transition: 0.3s;
        }

        .neon-input:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.55);
        }

        /* Grade de Ícones / Cards do Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .icon-card {
            background: #090912;
            border: 2px solid #00f3ff;
            border-radius: 22px;
            padding: 26px 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25), inset 0 0 12px rgba(0, 243, 255, 0.08);
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .icon-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #09ff00;
            box-shadow: 0 0 25px rgba(5, 144, 37, 0.55), inset 0 0 15px rgba(255, 0, 234, 0.15);
        }

        .card-icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.7));
        }

        .card-category {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00f508;
            text-shadow: 0 0 6px #0db401;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 1.15rem;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
            margin-bottom: 14px;
        }

        .card-open-label {
            font-size: 0.8rem;
            color: #39ff14;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }

        /* Página Aberta da Ideia / Pesquisa */
        .detail-page {
            display: none;
            background: #090910;
            border: 2px solid #39ff14;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 0 28px rgba(57, 255, 20, 0.3);
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        .detail-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(57, 255, 20, 0.3);
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .detail-header-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 12px rgba(57, 255, 20, 0.7));
        }

        .detail-category {
            color: #04ff64;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px #00ff33;
        }

        .detail-title {
            color: #39ff14;
            font-size: 1.8rem;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.6);
        }

        .detail-content {
            background: #050508;
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 16px;
            padding: 22px;
            color: #e8eeff;
            font-size: 1rem;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        .detail-link {
            display: inline-block;
            margin-top: 18px;
            color: #00f3ff;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 8px #00f3ff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <main class="container research-container">

        <!-- TELA 1: MENU DE ÍCONES -->
        <div id="menuView">
            <div class="top-bar">
                <header class="header" style="text-align: left;">
                    <h3>ARQUIVO PESSOAL</h3>
                    <h1 style="margin-bottom: 0;">MINHAS IDEIAS</h1>
                </header>
                <a href="index.html" class="neon-btn">🔒 Sair</a>
            </div>

            <div class="search-bar">
                <input type="text" id="filtro" class="neon-input" placeholder="🔍 Filtrar ideias pelo nome...">
            </div>

            <!-- Os ícones são criados automaticamente a partir da lista lá embaixo no código -->
            <section class="menu-grid" id="menuGrid"></section>
        </div>

        <!-- TELA 2: PÁGINA INTERNA DA IDEIA SELECIONADA -->
        <section id="detailView" class="detail-page">
            <div class="detail-top">
                <button type="button" id="backToMenuBtn" class="neon-btn">← Voltar ao Menu</button>
                <span id="detailDate" style="color: #7d87a2; font-size: 0.85rem;"></span>
            </div>

            <div class="detail-header-info">
                <div class="detail-icon" id="detailIcon">💡</div>
                <div>
                    <div class="detail-category" id="detailCategory">CATEGORIA</div>
                    <h2 class="detail-title" id="detailTitle">Título</h2>
                </div>
            </div>

            <div class="detail-content" id="detailContent"></div>

            <a href="#" target="_blank" id="detailLink" class="detail-link hidden">🔗 Abrir link relacionado →</a>
        </section>

    </main>

    <script>
        // =========================================================================
        // ✍️ ESCREVA SUAS IDEIAS E PESQUISAS AQUI DENTRO!
        // Toda vez que quiser adicionar uma nova ideia, copie um bloco { ... },
        // cole no topo da lista e preencha. Um ícone novo aparecerá no menu!
        // =========================================================================
        const MINHAS_PESQUISAS = [
            {
                icone: "",
                categoria: "YOUTUBE",
                titulo: "XIAOMI 18 PRO MAX",
                data: "24/11/2026",
                link: "https://www.youtube.com/watch?v=A29056hds10",
                texto: `J'ai voulu vivre avec le Xiaomi 18 Pro Max plutôt que simplement le tester. Et pour l'occasion, direction Paris pendant 3 jours, entre voyage, lancement Xiaomi, photos, moments du quotidien et découverte de ce smartphone dans des situations bien réelles.
Son écran arrière, ses capacités photo, son design et tout ce qu'il m'accompagne à faire au quotidien… je vous emmène avec moi pour découvrir cette expérience.
Et vous, que pensez-vous de ce Xiaomi 18 Pro Max et de son écran arrière ? Dites-moi votre avis en commentaire ! Et si la vidéo vous plaît, pensez à liker et à vous abonner pour ne rien manquer des prochaines vidéos. 👋
Vidéo en collaboration avec Xiaomi`
            },
            {
                icone: "📻",
                categoria: "Rádio DJ Marcelo",
                titulo: "Playlists e Vinhetas",
                data: "24/11/2026",
                link: "https://radiodjmarcelo.pages.dev",
                texto: `Anotações para a rádio online:
- Colocar mais músicas anos 80 e 90
- Ajustar o player no celular`
            },
            {
                icone: "🐧",
                categoria: "BigLinux & VS Code",
                titulo: "Comandos Úteis do Terminal",
                data: "24/11/2026",
                link: "",
                texto: `Comandos que uso no dia a dia:
- git add .
- git commit -m "nova ideia"
- git push`
            }
        ];
        // =========================================================================

        const menuView = document.getElementById('menuView');
        const detailView = document.getElementById('detailView');
        const menuGrid = document.getElementById('menuGrid');
        const filtro = document.getElementById('filtro');

        function renderizarMenu(termo = '') {
            menuGrid.innerHTML = '';

            const filtradas = MINHAS_PESQUISAS
                .map((item, index) => ({ ...item, indexOriginal: index }))
                .filter(p =>
                    p.titulo.toLowerCase().includes(termo.toLowerCase()) ||
                    p.categoria.toLowerCase().includes(termo.toLowerCase()) ||
                    p.texto.toLowerCase().includes(termo.toLowerCase())
                );

            if (filtradas.length === 0) {
                menuGrid.innerHTML = '<p style="color: #8892b0; grid-column: 1 / -1;">Nenhuma ideia encontrada com esse nome.</p>';
                return;
            }

            filtradas.forEach(item => {
                const card = document.createElement('div');
                card.className = 'icon-card';
                card.onclick = () => abrirIdeia(item.indexOriginal);
                card.innerHTML = `
                    <div class="card-icon">${item.icone || '💡'}</div>
                    <div class="card-category">${item.categoria}</div>
                    <h3 class="card-title">${item.titulo}</h3>
                    <span class="card-open-label">Abrir página →</span>
                `;
                menuGrid.appendChild(card);
            });
        }

        function abrirIdeia(index) {
            const item = MINHAS_PESQUISAS[index];
            if (!item) return;

            document.getElementById('detailIcon').textContent = item.icone || '💡';
            document.getElementById('detailCategory').textContent = item.categoria;
            document.getElementById('detailTitle').textContent = item.titulo;
            document.getElementById('detailDate').textContent = item.data ? `Data: ${item.data}` : '';
            document.getElementById('detailContent').textContent = item.texto;

            const linkEl = document.getElementById('detailLink');
            if (item.link) {
                linkEl.href = item.link;
                linkEl.classList.remove('hidden');
            } else {
                linkEl.classList.add('hidden');
            }

            menuView.classList.add('hidden');
            detailView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('backToMenuBtn').addEventListener('click', () => {
            detailView.style.display = 'none';
            menuView.classList.remove('hidden');
        });

        filtro.addEventListener('input', (e) => {
            renderizarMenu(e.target.value);
        });

        renderizarMenu();
    </script>

</body>
</html>
