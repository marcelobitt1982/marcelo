<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Pesquisas - Marcelo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            align-items: flex-start;
            padding-top: 35px;
        }

        .research-container {
            width: 100%;
            max-width: 960px;
            animation: emergeFromBack 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes emergeFromBack {
            0% {
                opacity: 0;
                transform: perspective(1100px) translateZ(-450px) scale(0.75);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: perspective(1100px) translateZ(0px) scale(1);
                filter: blur(0px);
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-bar {
            margin-bottom: 18px;
        }

        .neon-input {
            width: 100%;
            background: #06060a;
            border: 1px solid #1eff00;
            border-radius: 12px;
            padding: 13px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 0, 234, 0.25);
            transition: 0.3s;
        }

        .neon-input:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.55);
        }

        /* Barra de Classes / Categorias */
        .class-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }

        .class-tab-btn {
            background: #090912;
            color: #cfd8f5;
            border: 1.5px solid rgba(0, 243, 255, 0.45);
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .class-tab-btn:hover {
            border-color: #39ff14;
            color: #fff;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.35);
        }

        .class-tab-btn.active {
            background: rgba(0, 243, 255, 0.14);
            border-color: #00f3ff;
            color: #00f3ff;
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.5);
        }

        /* Seções por Classe */
        .class-sections-wrapper {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .class-section-title {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.45);
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(57, 255, 20, 0.25);
            text-align: left;
        }

        /* Grade de Ícones / Cards do Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .icon-card {
            background: #090912;
            border: 2px solid #00f3ff;
            border-radius: 22px;
            padding: 24px 18px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25), inset 0 0 12px rgba(0, 243, 255, 0.08);
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-width: 0;
        }

        .icon-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #09ff00;
            box-shadow: 0 0 25px rgba(5, 144, 37, 0.55), inset 0 0 15px rgba(255, 0, 234, 0.15);
        }

        /* Cores sutis por classe */
        .icon-card.classe-youtube {
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .icon-card.classe-windows {
            border-color: #00a8ff;
        }

        .icon-card.classe-linux {
            border-color: #ffae00;
        }

        .icon-card.classe-receitas {
            border-color: #ff6b35;
        }

        .icon-card.classe-tecnologia {
            border-color: #b537f2;
        }

        /* Estilo especial para cards com miniatura do YouTube */
        .icon-card.youtube-card {
            padding: 0 0 18px 0;
            overflow: hidden;
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .icon-card.youtube-card:hover {
            border-color: #39ff14;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.55);
        }

        .yt-thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 0, 85, 0.4);
        }

        .yt-thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .icon-card.youtube-card:hover .yt-thumb-img {
            transform: scale(1.06);
        }

        .yt-play-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 30px;
            background: rgba(255, 0, 0, 0.9);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.95rem;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .yt-card-body {
            padding: 0 14px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        .card-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .card-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .card-category {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #00f508;
            text-shadow: 0 0 6px #0db401;
            margin-bottom: 5px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-title {
            font-size: 1.05rem;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
            margin-bottom: 8px;
            word-break: break-word;
        }

        .card-note {
            font-size: 0.82rem;
            color: #b8c4e0;
            line-height: 1.4;
            margin-bottom: 12px;
            white-space: pre-line;
            background: rgba(255, 255, 255, 0.03);
            border-left: 2px solid #00f3ff;
            padding: 7px 9px;
            border-radius: 6px;
            width: 100%;
            text-align: left;
            word-break: break-word;
        }

        .card-open-label {
            font-size: 0.78rem;
            color: #39ff14;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }

        .yt-label {
            color: #ff2a70;
            text-shadow: 0 0 8px rgba(255, 42, 112, 0.6);
        }

        /* Página Aberta da Ideia / Pesquisa */
        .detail-page {
            display: none;
            background: #090910;
            border: 2px solid #39ff14;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 0 28px rgba(57, 255, 20, 0.3);
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        .detail-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(57, 255, 20, 0.3);
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .detail-header-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-icon {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
        }

        .detail-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .detail-category {
            color: #04ff64;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px #00ff33;
        }

        .detail-title {
            color: #39ff14;
            font-size: 1.8rem;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.6);
        }

        .detail-content {
            background: #050508;
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 16px;
            padding: 22px;
            color: #e8eeff;
            font-size: 1rem;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        .detail-link {
            display: inline-block;
            margin-top: 18px;
            color: #00f3ff;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 8px #00f3ff;
        }

        .hidden {
            display: none !important;
        }

        /* Celular: mantém sempre 3 cards por linha (3x3 conforme adiciona itens) */
        @media (max-width: 768px) {
            body {
                padding-top: 18px;
            }

            .class-tabs {
                gap: 6px;
                margin-bottom: 16px;
            }

            .class-tab-btn {
                padding: 6px 10px;
                font-size: 0.7rem;
            }

            .class-sections-wrapper {
                gap: 18px;
            }

            .class-section-title {
                font-size: 0.78rem;
                margin-bottom: 8px;
            }

            .menu-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
            }

            .icon-card {
                border-radius: 12px;
                padding: 10px 6px;
            }

            .icon-card.youtube-card {
                padding: 0 0 10px 0;
                border-radius: 12px;
            }

            .yt-thumb-wrapper {
                margin-bottom: 6px;
            }

            .yt-play-badge {
                width: 24px;
                height: 18px;
                font-size: 0.55rem;
                border-radius: 4px;
            }

            .yt-card-body {
                padding: 0 5px;
            }

            .card-icon {
                width: 34px;
                height: 34px;
                margin-bottom: 6px;
                font-size: 1.4rem;
            }

            .card-category {
                font-size: 0.45rem;
                letter-spacing: 0.5px;
                margin-bottom: 3px;
            }

            .card-title {
                font-size: 0.65rem;
                line-height: 1.2;
                margin-bottom: 5px;
            }

            .card-note {
                font-size: 0.55rem;
                line-height: 1.25;
                padding: 4px 5px;
                margin-bottom: 6px;
                border-left-width: 1.5px;
            }

            .card-open-label {
                font-size: 0.52rem;
                line-height: 1.15;
            }
        }
    </style>
</head>
<body>

    <main class="container research-container">

        <!-- TELA 1: MENU DE ÍCONES E VÍDEOS -->
        <div id="menuView">
            <div class="top-bar">
                <header class="header" style="text-align: left;">
                    <h3>Marcelo Bittencourt</h3>
                    <h1 style="margin-bottom: 0;">IDEIAS</h1>
                </header>
                <a href="index.html" class="neon-btn">🔒 Sair</a>
            </div>

            <div class="search-bar">
                <input type="text" id="filtro" class="neon-input" placeholder="🔍 Filtrar vídeos ou ideias pelo nome...">
            </div>

            <!-- Botões para separar por classe -->
            <nav class="class-tabs" id="classTabs" aria-label="Classes de pesquisa"></nav>

            <!-- Os cards e miniaturas são criados automaticamente a partir da lista lá embaixo -->
            <section class="class-sections-wrapper" id="menuGrid"></section>
        </div>

        <!-- TELA 2: PÁGINA INTERNA DA IDEIA SELECIONADA (Para notas sem vídeo) -->
        <section id="detailView" class="detail-page">
            <div class="detail-top">
                <button type="button" id="backToMenuBtn" class="neon-btn">← Voltar ao Menu</button>
                <span id="detailDate" style="color: #7d87a2; font-size: 0.85rem;"></span>
            </div>

            <div class="detail-header-info">
                <div class="detail-icon" id="detailIcon"></div>
                <div>
                    <div class="detail-category" id="detailCategory">CATEGORIA</div>
                    <h2 class="detail-title" id="detailTitle">Título</h2>
                </div>
            </div>

            <div class="detail-content" id="detailContent"></div>

            <a href="#" target="_blank" id="detailLink" class="detail-link hidden">🔗 Abrir link relacionado →</a>
        </section>

    </main>

    <script>
        // =========================================================================
        // ✍️ ADICIONE SEUS VÍDEOS DO YOUTUBE OU IDEIAS AQUI DENTRO!
        // Use o campo "classe" com uma das classes:
        // "YouTube", "Windows", "Linux", "receitas", "tecnologia"
        // =========================================================================
        const CLASSES_DISPONIVEIS = [
            "YouTube",
            "Windows",
            "Linux",
            "receitas",
            "tecnologia"
        ];

        const ICONES_POR_CLASSE = {
            Windows: `
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="winGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#00f3ff"/>
                            <stop offset="100%" stop-color="#0077ff"/>
                        </linearGradient>
                    </defs>
                    <path d="M10 15.5L28.5 13V30.5H10V15.5Z" fill="url(#winGrad)" stroke="#9cf8ff" stroke-width="1.5"/>
                    <path d="M31.5 12.6L54 9.5V30.5H31.5V12.6Z" fill="url(#winGrad)" stroke="#9cf8ff" stroke-width="1.5"/>
                    <path d="M10 33.5H28.5V51L10 48.5V33.5Z" fill="url(#winGrad)" stroke="#9cf8ff" stroke-width="1.5"/>
                    <path d="M31.5 33.5H54V54.5L31.5 51.4V33.5Z" fill="url(#winGrad)" stroke="#9cf8ff" stroke-width="1.5"/>
                </svg>
            `,
            Linux: `
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="linuxBody" x1="16" y1="10" x2="48" y2="56" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#2c3347"/>
                            <stop offset="100%" stop-color="#111522"/>
                        </linearGradient>
                    </defs>
                    <ellipse cx="32" cy="36" rx="16.5" ry="19.5" fill="url(#linuxBody)" stroke="#ffae00" stroke-width="2.2"/>
                    <circle cx="32" cy="21" r="10.5" fill="url(#linuxBody)" stroke="#ffae00" stroke-width="2.2"/>
                    <ellipse cx="32" cy="39.5" rx="10.5" ry="12.5" fill="#f5f7ff"/>
                    <circle cx="28.2" cy="19.5" r="2.3" fill="#ffffff"/>
                    <circle cx="35.8" cy="19.5" r="2.3" fill="#ffffff"/>
                    <circle cx="28.5" cy="19.5" r="1.1" fill="#090912"/>
                    <circle cx="35.5" cy="19.5" r="1.1" fill="#090912"/>
                    <path d="M27.5 24.5C29.5 27.5 34.5 27.5 36.5 24.5C34.5 23.2 29.5 23.2 27.5 24.5Z" fill="#ffae00"/>
                    <ellipse cx="22.5" cy="54.5" rx="6.5" ry="3.2" fill="#ffae00"/>
                    <ellipse cx="41.5" cy="54.5" rx="6.5" ry="3.2" fill="#ffae00"/>
                </svg>
            `,
            receitas: `
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="panGrad" x1="10" y1="28" x2="54" y2="52" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ff9e2c"/>
                            <stop offset="100%" stop-color="#ff4d4d"/>
                        </linearGradient>
                    </defs>
                    <path d="M22 18C22 14.5 25 13 25 9.5" stroke="#39ff14" stroke-width="2.3" stroke-linecap="round"/>
                    <path d="M32 17C32 13 35 11.5 35 8" stroke="#00f3ff" stroke-width="2.3" stroke-linecap="round"/>
                    <path d="M42 18C42 14.5 45 13 45 9.5" stroke="#ffae00" stroke-width="2.3" stroke-linecap="round"/>
                    <circle cx="32" cy="24.5" r="2.5" fill="#ffd166"/>
                    <path d="M16 33C16 26.8 23.2 25.5 32 25.5C40.8 25.5 48 26.8 48 33H16Z" fill="url(#panGrad)" stroke="#ffd166" stroke-width="1.6"/>
                    <rect x="12" y="34" width="40" height="4.5" rx="2.2" fill="#ffd166"/>
                    <path d="M16 38.5H48L44.5 49.5C44 51.2 42.4 52.5 40.6 52.5H23.4C21.6 52.5 20 51.2 19.5 49.5L16 38.5Z" fill="url(#panGrad)" stroke="#ff9e2c" stroke-width="1.6"/>
                </svg>
            `,
            tecnologia: `
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="chipGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#d966ff"/>
                            <stop offset="100%" stop-color="#00f3ff"/>
                        </linearGradient>
                    </defs>
                    <rect x="17" y="17" width="30" height="30" rx="6" fill="#120c24" stroke="url(#chipGrad)" stroke-width="2.5"/>
                    <rect x="24" y="24" width="16" height="16" rx="3" fill="url(#chipGrad)" fill-opacity="0.28" stroke="#00f3ff" stroke-width="1.6"/>
                    <circle cx="32" cy="32" r="3" fill="#39ff14"/>
                    <path d="M23 10V17M32 10V17M41 10V17M23 47V54M32 47V54M41 47V54" stroke="#00f3ff" stroke-width="2.4" stroke-linecap="round"/>
                    <path d="M10 23H17M10 32H17M10 41H17M47 23H54M47 32H54M47 41H54" stroke="#d966ff" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
            `
        };

        const MINHAS_PESQUISAS = [
            {
                classe: "YouTube",
                titulo: "XIAOMI 18 PRO MAX",
                link: "https://www.youtube.com/watch?v=A29056hds10",
                texto: `J'ai voulu vivre avec le Xiaomi 18 Pro Max plutôt que simplement le tester.`
            },
            {
                classe: "YouTube",
                titulo: "PILAX",
                link: "https://www.youtube.com/watch?v=VmhJhezUk8k",
                texto: `Mutxulada · Pilax · Dj Blax · PILAX · DJ BLAX`
            },
            {
                classe: "YouTube",
                titulo: "Engenheiros do Hawaii",
                link: "https://www.youtube.com/watch?v=UJf_o8P5wNg&t=576s",
                texto: `A Coletânea Definitiva com Humberto Gessinger ⚡`
            },
            {
                classe: "Windows",
                titulo: "Atalhos e Limpeza",
                link: "",
                texto: `Dicas rápidas para manter o Windows leve no dia a dia.`
            },
            {
                classe: "Linux",
                titulo: "Comandos do Terminal",
                link: "",
                texto: `Comandos úteis para pacotes, arquivos e Git.`
            },
            {
                classe: "receitas",
                titulo: "Receitas Salvas",
                link: "",
                texto: `Ideias de pratos rápidos e anotações de preparo.`
            },
            {
                classe: "tecnologia",
                titulo: "Novidades & Gadgets",
                link: "",
                texto: `Smartphones, ferramentas e testes interessantes.`
            }
        ];
        // =========================================================================

        const menuView = document.getElementById('menuView');
        const detailView = document.getElementById('detailView');
        const menuGrid = document.getElementById('menuGrid');
        const classTabs = document.getElementById('classTabs');
        const filtro = document.getElementById('filtro');

        let classeAtiva = 'Todas';

        function extrairIdYouTube(url) {
            if (!url) return null;
            const regex = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        function normalizarClasse(valor) {
            if (!valor) return 'tecnologia';
            const limpo = valor.trim().toLowerCase();
            const encontrada = CLASSES_DISPONIVEIS.find(c => c.toLowerCase() === limpo);
            return encontrada || valor.trim();
        }

        function slugClasse(valor) {
            return normalizarClasse(valor).toLowerCase().replace(/[^a-z0-9]+/g, '-');
        }

        function obterIconeHtml(item, classeNome) {
            if (item.icone && item.icone.trim()) {
                return item.icone.trim();
            }
            if (ICONES_POR_CLASSE[classeNome]) {
                return ICONES_POR_CLASSE[classeNome];
            }
            return '💡';
        }

        function renderizarAbas() {
            const opcoes = ['Todas', ...CLASSES_DISPONIVEIS];
            classTabs.innerHTML = '';

            opcoes.forEach(nomeClasse => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `class-tab-btn ${classeAtiva === nomeClasse ? 'active' : ''}`;
                btn.textContent = nomeClasse;
                btn.onclick = () => {
                    classeAtiva = nomeClasse;
                    renderizarAbas();
                    renderizarMenu(filtro.value);
                };
                classTabs.appendChild(btn);
            });
        }

        function criarCardElement(item) {
            const videoId = extrairIdYouTube(item.link);
            const classeNome = normalizarClasse(item.classe || item.categoria);
            const classeSlug = slugClasse(classeNome);
            const card = document.createElement('div');
            const mensagemHtml = item.texto && item.texto.trim()
                ? `<p class="card-note">${item.texto.trim()}</p>`
                : '';

            if (videoId) {
                const thumbUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                card.className = `icon-card youtube-card classe-${classeSlug}`;
                card.onclick = () => window.open(item.link, '_blank', 'noopener,noreferrer');
                card.innerHTML = `
                    <div class="yt-thumb-wrapper">
                        <img src="${thumbUrl}" alt="${item.titulo || 'Vídeo do YouTube'}" class="yt-thumb-img" loading="lazy">
                        <div class="yt-play-badge">▶</div>
                    </div>
                    <div class="yt-card-body">
                        <div class="card-category">${classeNome}</div>
                        <h3 class="card-title">${item.titulo || 'Vídeo sem título'}</h3>
                        ${mensagemHtml}
                        <span class="card-open-label yt-label">▶ YOUTUBE →</span>
                    </div>
                `;
            } else {
                const iconeHtml = obterIconeHtml(item, classeNome);
                card.className = `icon-card classe-${classeSlug}`;
                card.onclick = () => abrirIdeia(item.indexOriginal);
                card.innerHTML = `
                    <div class="card-icon">${iconeHtml}</div>
                    <div class="card-category">${classeNome}</div>
                    <h3 class="card-title">${item.titulo || 'Sem título'}</h3>
                    ${mensagemHtml}
                    <span class="card-open-label">Abrir página →</span>
                `;
            }

            return card;
        }

        function renderizarMenu(termo = '') {
            menuGrid.innerHTML = '';
            const termoLower = termo.trim().toLowerCase();

            const filtradas = MINHAS_PESQUISAS
                .map((item, index) => ({
                    ...item,
                    indexOriginal: index,
                    classeNormalizada: normalizarClasse(item.classe || item.categoria)
                }))
                .filter(p => {
                    const bateTexto =
                        !termoLower ||
                        (p.titulo && p.titulo.toLowerCase().includes(termoLower)) ||
                        (p.classeNormalizada && p.classeNormalizada.toLowerCase().includes(termoLower)) ||
                        (p.texto && p.texto.toLowerCase().includes(termoLower));

                    const bateClasse =
                        termoLower || classeAtiva === 'Todas' || p.classeNormalizada === classeAtiva;

                    return bateTexto && bateClasse;
                });

            if (filtradas.length === 0) {
                menuGrid.innerHTML = '<p style="color: #8892b0;">Nenhum vídeo ou ideia encontrada nessa classe.</p>';
                return;
            }

            const classesParaExibir = termoLower
                ? [...new Set(filtradas.map(f => f.classeNormalizada))]
                : (classeAtiva === 'Todas' ? CLASSES_DISPONIVEIS : [classeAtiva]);

            classesParaExibir.forEach(nomeClasse => {
                const itensDaClasse = filtradas.filter(f => f.classeNormalizada === nomeClasse);
                if (itensDaClasse.length === 0) return;

                const secao = document.createElement('div');

                if (classeAtiva === 'Todas' || termoLower) {
                    const tituloSecao = document.createElement('h2');
                    tituloSecao.className = 'class-section-title';
                    tituloSecao.textContent = nomeClasse;
                    secao.appendChild(tituloSecao);
                }

                const gridDaClasse = document.createElement('div');
                gridDaClasse.className = 'menu-grid';
                itensDaClasse.forEach(item => {
                    gridDaClasse.appendChild(criarCardElement(item));
                });

                secao.appendChild(gridDaClasse);
                menuGrid.appendChild(secao);
            });
        }

        function abrirIdeia(index) {
            const item = MINHAS_PESQUISAS[index];
            if (!item) return;

            const classeNome = normalizarClasse(item.classe || item.categoria);
            document.getElementById('detailIcon').innerHTML = obterIconeHtml(item, classeNome);
            document.getElementById('detailCategory').textContent = classeNome;
            document.getElementById('detailTitle').textContent = item.titulo || 'Sem título';
            document.getElementById('detailDate').textContent = item.data ? `Data: ${item.data}` : '';
            document.getElementById('detailContent').textContent = item.texto || '';

            const linkEl = document.getElementById('detailLink');
            if (item.link) {
                linkEl.href = item.link;
                linkEl.classList.remove('hidden');
            } else {
                linkEl.classList.add('hidden');
            }

            menuView.classList.add('hidden');
            detailView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('backToMenuBtn').addEventListener('click', () => {
            detailView.style.display = 'none';
            menuView.classList.remove('hidden');
        });

        filtro.addEventListener('input', (e) => {
            renderizarMenu(e.target.value);
        });

        renderizarAbas();
        renderizarMenu();
    </script>

</body>
</html>
